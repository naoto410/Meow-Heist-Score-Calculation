<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
  margin: 0;
  padding: 0;
}

header,main {
  max-width: 100vh;
}

header {
  max-height: 10rem;
  height: 10rem;
}

main {
  padding: 3rem 1rem;
  height: calc(100vh - 16rem);
  display: flex;
  flex-direction: column;
  align-items: center;
}

input {
  width: 2.1rem;
}

button {
  padding: 0.5rem;
  border-radius: 12px;
}

.img {
  object-fit: cover;
  width: 100%;
  height: 100%;
}

.content {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  align-items: center;
  margin-bottom: 3rem;
}

.gem {
  display: flex;
  gap: 1rem;
}

.result {
  font-weight: bold;
  font-size: 1.5rem;
  margin-bottom: 1rem;
}
  </style>

  <title>ぬすっとキャット得点計算</title>
</head>
<body>
  <header class="header">
    <img src="./images/IMG_2288.JPG" alt="" class="img">
  </header>
  <main>
    <div class="content">
      <div class="gem">
        <p>赤のおたから</p>
        <input type="number" id="redCount">
        <p>個 = <span id="redScore">0</span>点</p>
      </div>
      <div class="gem">
        <p>黄のおたから</p>
        <input type="number" id="yellowCount">
        <p>個 = <span id="yellowScore">0</span>点</p>
      </div>
      <div class="gem">
        <p>青のおたから</p>
        <input type="number" id="blueCount">
        <p>個 = <span id="blueScore">0</span>点</p>
      </div>
      <div class="gem">
        <p>黒のいしころ</p>
        <input type="number" id="stoneCount">
        <p>個 = <span id="stoneScore">0</span>点</p>
      </div>
    </div>
    <p class="result">合計点数 <span id="totalScore">0</span> 点</p>
    <button type="button" id="resetBtn">リセット</button>
  </main>
</body>

<script>
  const redCount = document.getElementById('redCount');
  const redScore = document.getElementById('redScore');
  const yellowCount = document.getElementById('yellowCount');
  const yellowScore = document.getElementById('yellowScore');
  const blueCount = document.getElementById('blueCount');
  const blueScore = document.getElementById('blueScore');
  const stoneCount = document.getElementById('stoneCount');
  const stoneScore = document.getElementById('stoneScore');
  const totalScore = document.getElementById('totalScore');

  function update() {
    const redResult = (Number(redCount.value) || 0) * 3;
    const yellowResult = (Number(yellowCount.value) || 0) * 2;
    const blueResult = (Number(blueCount.value) || 0) * 1;
    const stoneResult = (Number(stoneCount.value) || 0) * -1;

    redScore.textContent = redResult;
    yellowScore.textContent = yellowResult;
    blueScore.textContent = blueResult;
    stoneScore.textContent = stoneResult;
    totalScore.textContent = redResult + yellowResult + blueResult + stoneResult;
  }

  redCount.addEventListener('input', update);
  yellowCount.addEventListener('input', update);
  blueCount.addEventListener('input', update);
  stoneCount.addEventListener('input', update);

  const resetBtn = document.getElementById('resetBtn');
  resetBtn.addEventListener('click', () => {
    redCount.value = '';
    yellowCount.value = '';
    blueCount.value = '';
    stoneCount.value = '';
    update();
  });
</script>
</html>
