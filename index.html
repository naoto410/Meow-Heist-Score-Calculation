  <style>
    * {
      margin: 0;
      padding: 0;
    }

    header,main {
      max-width: 100vh;
    }

    header {
      max-height: 10rem;
      height: 10rem;
    }

    main {
      padding: 3rem 1rem;
      height: calc(100vh - 16rem);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input {
      width: 2.1rem;
    }

    button {
      padding: 0.5rem;
      border-radius: 12px;
    }

    .img {
      object-fit: cover;
      width: 100%;
      height: 100%;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: repeat(4,2rem);
      place-items: center;
      gap: 0.5rem;
      margin-bottom: 3rem;
    }

    .result {
      font-weight: bold;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .st1 {
      stroke:#4B4B4B;
      stroke-width: 0.5%;
    }

    .redGem {
      fill: rgb(255, 0, 0);
    }

    .yellowGem {
      fill: rgb(255, 250, 50);
    }

    .blueGem {
      fill: rgb(50, 155, 255);
    }

  </style>

<script>
  const redCount = document.getElementById('redCount');
  const redScore = document.getElementById('redScore');
  const yellowCount = document.getElementById('yellowCount');
  const yellowScore = document.getElementById('yellowScore');
  const blueCount = document.getElementById('blueCount');
  const blueScore = document.getElementById('blueScore');
  const stoneCount = document.getElementById('stoneCount');
  const stoneScore = document.getElementById('stoneScore');
  const totalScore = document.getElementById('totalScore');

  function update() {
    const redResult = (Number(redCount.value) || 0) * 3;
    const yellowResult = (Number(yellowCount.value) || 0) * 2;
    const blueResult = (Number(blueCount.value) || 0) * 1;
    const stoneResult = (Number(stoneCount.value) || 0) * -1;

    redScore.textContent = redResult;
    yellowScore.textContent = yellowResult;
    blueScore.textContent = blueResult;
    stoneScore.textContent = stoneResult;
    totalScore.textContent = redResult + yellowResult + blueResult + stoneResult;
  }

  redCount.addEventListener('input', update);
  yellowCount.addEventListener('input', update);
  blueCount.addEventListener('input', update);
  stoneCount.addEventListener('input', update);

  const resetBtn = document.getElementById('resetBtn');
  resetBtn.addEventListener('click', () => {
    redCount.value = '';
    yellowCount.value = '';
